plugins {
	id 'fabric-loom' version '1.6-SNAPSHOT'
	id 'maven-publish'
	//id 'com.github.johnrengelman.shadow' version '7.1.2'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {}

loom {
    splitEnvironmentSourceSets()

	mods {
		"rules4worlds-fabric" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

fabricApi {
	//configureDataGeneration()
}

dependencies {
	if (minecraft_version == "1.20.5") {
		minecraft "com.mojang:minecraft:1.20.5"
		mappings "net.fabricmc:yarn:1.20.5+build.1:v2"
		modImplementation "net.fabricmc:fabric-loader:0.15.11"
		modImplementation "net.fabricmc.fabric-api:fabric-api:0.97.8+1.20.5"
	}
	if (minecraft_version == "1.20.6") {
		minecraft "com.mojang:minecraft:1.20.6"
		mappings "net.fabricmc:yarn:1.20.6+build.3:v2"
		modImplementation "net.fabricmc:fabric-loader:0.15.11"
		modImplementation "net.fabricmc.fabric-api:fabric-api:0.100.4+1.20.6"
	}
	if (minecraft_version == "1.21") {
		minecraft "com.mojang:minecraft:1.21"
		mappings "net.fabricmc:yarn:1.21+build.7:v2"
		modImplementation "net.fabricmc:fabric-loader:0.15.11"
		modImplementation "net.fabricmc.fabric-api:fabric-api:0.100.4+1.21"
	}
}

/*shadowJar {
	configurations = [project.configurations.shadow]
	mergeServiceFiles()
	zip64 true
}*/

processResources {
	inputs.property "mod_version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "min_minecraft_version", project.min_minecraft_version
	inputs.property "max_minecraft_version", project.max_minecraft_version
	inputs.property "loader_version", project.loader_version
	filteringCharset "UTF-8"

	filesMatching("fabric.mod.json") {
		expand "mod_version": project.version,
				"minecraft_version": project.minecraft_version,
				"min_minecraft_version": project.min_minecraft_version,
				"max_minecraft_version": project.max_minecraft_version,
				"loader_version": project.loader_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("rules4worlds", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
		mavenLocal()
	}
}